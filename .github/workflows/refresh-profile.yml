name: Refresh profile activity
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save refreshed charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats-dark.svg assets/stats-light.svg assets/activity-dark.svg assets/activity-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh GitHub contribution charts"
            git push
          fi
